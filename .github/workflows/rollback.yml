name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to roll back to (e.g. sha-abc1234). Leave blank to use the image that was running immediately before the last deploy."
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: parc-ledger

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-parc-ledger
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Roll back VPS deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY,IMAGE_NAME,CONTAINER_NAME,REQUESTED_TAG
          script: |
            set -euo pipefail

            # Non-secret service identity; these override the same keys if they also appear in the env file.
            export NODE_ENV=production HOST=0.0.0.0 SERVICE_NAME=parc-ledger PORT=3003
            # Image references must be lowercase; metadata-action lowercased the pushed name.
            IMAGE_NAME=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
            # Per-service server state: .env plus current/previous image tags for rollback.
            STATE_ROOT=/opt/parc
            STATE_DIR="$STATE_ROOT/${CONTAINER_NAME}"
            # Secrets and environment-specific settings live only on the server, never in GitHub.
            ENV_FILE="$STATE_DIR/.env"
            if ! mkdir -p "$STATE_DIR" 2>/dev/null; then
              echo "Cannot create $STATE_DIR. Prepare the server once: sudo mkdir -p $STATE_ROOT && sudo chown $(id -un):$(id -gn) $STATE_ROOT" >&2
              exit 1
            fi
            chmod 700 "$STATE_DIR"

            if [ ! -f "$ENV_FILE" ]; then
              LEGACY_DIR="$HOME/parc/${CONTAINER_NAME}"
              if [ -f "$LEGACY_DIR/.env" ]; then
                echo "Missing $ENV_FILE, but $LEGACY_DIR/.env exists from the previous layout. Copy it once: cp -a $LEGACY_DIR/. $STATE_DIR/" >&2
              else
                echo "Missing $ENV_FILE on the server; create it from the repository's .env.example first." >&2
              fi
              exit 1
            fi
            chmod 600 "$ENV_FILE"

            # Last assignment wins, matching docker --env-file.
            env_value() { sed -n "s/^$1=//p" "$ENV_FILE" | tail -n 1; }

            for key in DATABASE_URL AUTH_JWKS_URL AUTH_JWT_ISSUER AUTH_TOKEN_URL SERVICE_CLIENT_KEY_ID SERVICE_CLIENT_PRIVATE_KEY_BASE64 TENANT_ADMIN_URL AMQP_URL; do
              if [ -z "$(env_value "$key")" ]; then
                echo "$ENV_FILE must set $key." >&2
                exit 1
              fi
            done

            stop_service() {
              for container in "$CONTAINER_NAME" "$CONTAINER_NAME-worker" "$CONTAINER_NAME-integrity-worker"; do
                docker stop "$container" >/dev/null 2>&1 || true
                docker rm "$container" >/dev/null 2>&1 || true
              done
            }

            start_service() {
              # The image tag (sha-xxxxxxx) is the running version, including after a rollback.
              export SERVICE_VERSION="${1##*:}"
              WORKER_CONTAINERS=()
              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart always \
                --network host \
                --env-file "$ENV_FILE" \
                -e NODE_ENV -e HOST -e PORT -e SERVICE_NAME -e SERVICE_VERSION \
                "$1"
              docker run -d --name "$CONTAINER_NAME-worker" --restart always --network host --env-file "$ENV_FILE" -e NODE_ENV -e HOST -e PORT -e SERVICE_NAME -e SERVICE_VERSION "$1" node dist/src/worker.js
              WORKER_CONTAINERS+=("$CONTAINER_NAME-worker")
              if [ -n "$(env_value LEDGER_INTEGRITY_TENANT_IDS)" ]; then
                docker run -d --name "$CONTAINER_NAME-integrity-worker" --restart always --network host --env-file "$ENV_FILE" -e NODE_ENV -e HOST -e PORT -e SERVICE_NAME -e SERVICE_VERSION "$1" node dist/src/integrity-worker.js
                WORKER_CONTAINERS+=("$CONTAINER_NAME-integrity-worker")
              fi
            }

            service_ready() {
              curl --fail --silent --max-time 2 "http://127.0.0.1:${PORT}/health" >/dev/null || return 1
              # Workers have no HTTP endpoint; require them to be running without restarts.
              for worker in "${WORKER_CONTAINERS[@]}"; do
                [ "$(docker inspect -f '{{.State.Running}}/{{.RestartCount}}' "$worker" 2>/dev/null)" = "true/0" ] || return 1
              done
            }

            wait_until_ready() {
              # Give crash-looping containers time to show up as restarts before the first probe.
              sleep 5
              for _ in $(seq 1 20); do
                service_ready && return 0
                sleep 3
              done
              return 1
            }

            if [ -n "$REQUESTED_TAG" ]; then
              if [[ ! "$REQUESTED_TAG" =~ ^sha-[0-9a-f]{7}$ ]]; then
                echo "Invalid rollback image tag; expected sha- followed by 7 lowercase hex characters." >&2
                exit 1
              fi
              IMAGE_URI="${REGISTRY}/${IMAGE_NAME}:${REQUESTED_TAG}"
            elif [ -f "$STATE_DIR/previous_image.txt" ]; then
              IMAGE_URI=$(cat "$STATE_DIR/previous_image.txt")
            else
              echo "No rollback target available: pass image_tag, or deploy at least twice first so a previous image is recorded." >&2
              exit 1
            fi

            echo "Rolling back to: $IMAGE_URI"
            docker pull "$IMAGE_URI"

            # Deliberately no migration step here: migrations are forward-only, so an
            # application rollback never reverts schema. If the failing deploy shipped a
            # breaking migration, that needs a reviewed forward-fix migration instead.

            stop_service
            start_service "$IMAGE_URI"

            if wait_until_ready; then
              echo "$IMAGE_URI" > "$STATE_DIR/current_image.txt"
              # Advance the default target to the image deployed before this one, so a
              # further rollback steps back again instead of redeploying the same image.
              OLDER_IMAGE=""
              if [ -f "$STATE_DIR/image_history.txt" ]; then
                OLDER_IMAGE=$(awk -v target="$IMAGE_URI" '$0 == target { found = prev } $0 != target { prev = $0 } END { print found }' "$STATE_DIR/image_history.txt")
              fi
              if [ -n "$OLDER_IMAGE" ]; then
                echo "$OLDER_IMAGE" > "$STATE_DIR/previous_image.txt"
              else
                rm -f "$STATE_DIR/previous_image.txt"
              fi
              echo "Rollback succeeded: $IMAGE_URI"
            else
              echo "Rollback containers failed readiness checks." >&2
              docker logs --tail 50 "$CONTAINER_NAME" >&2 || true
              exit 1
            fi
